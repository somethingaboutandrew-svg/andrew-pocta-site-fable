<html lang="en">

<!-- To change the words on this site, edit content.js. This file holds the design (v4 "Showreel"). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070707; --s1:#0f0f0e; --s2:#181817;            /* surfaces: one warm-neutral ramp */
  --fg:#f3f0e8; --body:#d6d2c8; --mute:#a8a49b;        /* three text roles */
  --line:rgba(243,240,232,.14);
  --hi:#d6ff3f;                                        /* the one accent */
  --ph:#ffb84d;
  --ease:cubic-bezier(.23,1,.32,1); --fast:150ms; --slow:300ms;
  --pad:clamp(20px,5vw,72px);
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"liga" 0,"calt" 0;font-variant-ligatures:none;overflow-x:clip}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol{margin:0}
:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
[id]{scroll-margin-top:56px}
.mono{font-family:var(--mono);font-size:12.5px}
.poster{font-stretch:68%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.86}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:fixed;left:16px;top:-64px;z-index:99;padding:12px 16px;border-radius:8px;background:var(--hi);color:#0a0a0a;font-weight:600;text-decoration:none}
.skip:focus{top:8px}
.ph{display:inline-block;font-family:var(--mono);font-size:12px;line-height:1.4;padding:2px 8px;border:1px dashed var(--ph);border-radius:6px;color:var(--ph);text-transform:none;letter-spacing:0;font-weight:400;font-stretch:100%}
noscript p{padding:120px var(--pad)}

/* header */
.top{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px;padding:0 var(--pad);background:rgba(7,7,7,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .who{font-weight:600;text-decoration:none;white-space:nowrap}
.top nav{display:flex;align-items:center;gap:4px}
.top nav a,.top nav button{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;text-decoration:none;font-size:14.5px;cursor:pointer;transition:background var(--fast) var(--ease)}
.top nav a:hover,.top nav button:hover{background:rgba(243,240,232,.1)}
.top nav .cta{margin-left:8px;background:var(--hi);color:#0a0a0a;font-weight:600}
.top nav .cta:hover{background:#e3ff7a}
kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:4px;color:var(--mute)}
.top .menu{display:none}

/* hero */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:96px var(--pad) 40px}
.hero h1{font-size:clamp(64px,15.4vw,300px)}
.hero h1>span{display:block}
.js .hero h1>span{animation:rise var(--slow) var(--ease) backwards}
.js .hero h1>span:nth-child(2){animation-delay:70ms}
.js .hero h1>span:nth-child(3){animation-delay:140ms}
.rot{display:inline-block;color:var(--hi)}
.rot.swap{animation:rise 260ms var(--ease)}
.hero-foot{display:grid;grid-template-columns:auto minmax(0,58ch) 1fr;gap:24px;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.js .hero-foot{animation:rise var(--slow) 220ms var(--ease) backwards}
.hero-foot img,.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover}
.avatar{display:grid;place-items:center;background:var(--s2);font-weight:600;font-size:24px}
.hero-foot p{color:var(--body)}
.hero-foot .meta{justify-self:end;text-align:right;color:var(--mute)}
.hero-foot .meta a{text-decoration:none}
.hero-foot .meta a:hover{color:var(--fg)}

/* project rail (desktop) */
.rail{position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;gap:4px;opacity:0;pointer-events:none;transition:opacity 200ms var(--ease)}
.rail.on{opacity:1;pointer-events:auto}
.rail a{display:flex;align-items:center;justify-content:flex-end;gap:8px;height:28px;padding:0 4px;text-decoration:none;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.rail a::after{content:"";width:14px;height:2px;background:currentColor;transform-origin:left;transition:transform 200ms var(--ease)}
.rail a em{font-style:normal;white-space:nowrap;padding:4px 8px;border-radius:6px;background:var(--s2);color:var(--fg);opacity:0;transform:translateX(6px);transition:opacity var(--fast) var(--ease),transform var(--fast) var(--ease)}
.rail a:hover em,.rail a:focus-visible em{opacity:1;transform:none}
.rail a[aria-current]{color:var(--c)}
.rail a[aria-current]::after{transform:scaleX(1.8)}

/* one project per screen */
.scene{position:relative;min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,80px);align-items:center;padding:112px calc(var(--pad) + 32px) 112px var(--pad);border-top:1px solid var(--line);overflow:hidden}
.scene:nth-of-type(even){grid-template-columns:minmax(0,7fr) minmax(0,5fr);padding:112px var(--pad) 112px calc(var(--pad) + 32px)}
.scene:nth-of-type(even) .txt{order:2;padding-right:32px}
.scene .topo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scene .topo path{fill:none;stroke:var(--c);stroke-width:1;opacity:.13}
.scene .txt,.scene .stage{position:relative}
.scene .eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.scene .no{color:var(--c)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid var(--c);border-radius:8px;color:var(--c)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.scene h2{font-size:clamp(46px,6.6vw,118px);margin:16px 0 20px;overflow-wrap:anywhere}
.scene .sum p{color:var(--body);max-width:56ch}
.scene .sum p+p{margin-top:12px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg);font-weight:500;font-size:15px;text-decoration:none;cursor:pointer;transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease),transform var(--fast) var(--ease)}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--fg);border-color:var(--fg);color:#0a0a0a;font-weight:600}
.btn.primary:hover{background:#fff}
.btn:active{transform:scale(.97)}
.notes{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.notes:not([hidden]){animation:rise 240ms var(--ease)}
.notes h4{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--c);margin:20px 0 8px}
.notes ul{padding-left:20px;color:var(--body)}
.notes li+li{margin-top:4px}
.notes p{color:var(--body);max-width:56ch}
.notes .lead{color:var(--fg);font-size:19px}
.notes .status{font-family:var(--mono);font-size:12.5px;margin-top:20px}
.notes .status span{color:var(--mute);margin-right:8px}
.stage{padding:clamp(12px,2.2vw,32px);border-radius:20px;background:color-mix(in srgb,var(--c) 14%,var(--s1))}
.stage .main{display:block;width:100%;padding:0;border:0;border-radius:8px;overflow:hidden;background:none;cursor:zoom-in}
.stage .main img{width:100%;max-height:64vh;object-fit:contain;border-radius:8px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.thumbs button{width:84px;height:60px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#000;cursor:pointer;opacity:.6;transition:opacity var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.thumbs button:hover{opacity:.85}
.thumbs button[aria-pressed=true]{opacity:1;border-color:var(--c)}
.thumbs img{width:100%;height:100%;object-fit:cover;object-position:top}
.js .scene .txt>*,.js .scene .stage{opacity:0;transform:translateY(24px);transition:opacity var(--slow) var(--ease),transform var(--slow) var(--ease)}
.js .scene .stage{transform:translateY(24px) scale(.97);transition-delay:80ms}
.js .scene.in .txt>*,.js .scene.in .stage{opacity:1;transform:none}
.js .scene.in .txt>*:nth-child(2){transition-delay:40ms}
.js .scene.in .txt>*:nth-child(n+3){transition-delay:80ms}

/* process / about / contact */
.blk{padding:128px var(--pad);border-top:1px solid var(--line)}
.blk>h2{font-size:clamp(54px,10vw,190px);margin-bottom:40px}
.lede{font-size:clamp(20px,2.2vw,30px);line-height:1.3;max-width:34ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:24px 0 64px}
.chips li{font-family:var(--mono);font-size:12.5px;padding:4px 12px;border:1px solid var(--line);border-radius:8px;color:var(--body)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;list-style:none;padding:0}
.steps li{border-top:1px solid var(--fg);padding-top:16px}
.steps .num{font-size:64px;color:var(--mute)}
.steps h3{font-size:21px;font-weight:600;margin:16px 0 8px}
.steps p{color:var(--body)}
.tools{margin-top:72px;padding-top:24px;border-top:1px solid var(--line)}
.tools ul{display:flex;flex-wrap:wrap;gap:8px 28px;list-style:none;padding:0;margin-top:12px}
.tools li{font-size:clamp(24px,2.6vw,36px);line-height:1.1;color:var(--body)}
.quote{font-size:clamp(30px,5.2vw,88px);line-height:1.02;font-weight:600;letter-spacing:-.02em;max-width:20ch;margin-bottom:72px}
.quote strong{color:var(--hi);font-weight:600}
.about{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(28px,5vw,80px);align-items:start}
.about>img{width:100%;max-width:420px;height:auto;border-radius:20px}
.about p{color:var(--body);max-width:62ch}
.about p+p{margin-top:16px}
.about .short{color:var(--fg);font-size:21px}
.cv{width:100%;border-collapse:collapse;margin-top:28px}
.cv td{padding:12px 0;border-top:1px solid var(--line);vertical-align:top}
.cv td:last-child{text-align:right;white-space:nowrap;padding-left:16px;font-family:var(--mono);font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.kicker{color:var(--mute)}
.mail{display:block;font-stretch:68%;font-weight:800;font-size:clamp(34px,8.6vw,170px);line-height:.95;letter-spacing:-.01em;margin:16px 0 40px;text-decoration:none;overflow-wrap:anywhere;transition:color var(--fast) var(--ease)}
.mail:hover{color:var(--hi)}
#links{display:flex;flex-wrap:wrap;gap:8px}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:24px var(--pad) 40px;border-top:1px solid var(--line);color:var(--mute)}

/* dialogs: media viewer + quick-jump palette */
dialog{border:0;padding:0;color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.86)}
dialog[open]{animation:pop 200ms var(--ease)}
#media{background:transparent;max-width:94vw;max-height:94vh;overflow:visible}
#media img,#media video{display:block;max-width:94vw;max-height:84vh;border-radius:8px;background:#000}
#media .mx{position:fixed;top:16px;right:16px;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--s2);cursor:pointer}
#cmdk{width:min(560px,92vw);margin-top:14vh;border-radius:14px;background:var(--s2);box-shadow:0 0 0 1px var(--line)}
#kq{width:100%;padding:16px 20px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font:500 17px var(--sans);outline:none}
#kl{list-style:none;max-height:min(360px,50vh);overflow:auto;padding:8px}
#kl li{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:15px}
#kl li span{font-family:var(--mono);font-size:11.5px;color:var(--mute);text-align:right}
#kl li.sel{background:rgba(243,240,232,.1)}

@keyframes rise{from{opacity:0;transform:translateY(.22em)}}
@keyframes pop{from{opacity:0;transform:scale(.97)}}

@media (max-width:900px){
  .rail,.top nav a:not(.cta),.top .jump{display:none}
  .top .menu{display:flex}
  .hero h1{font-size:clamp(64px,22vw,200px)}
  .hero-foot{grid-template-columns:64px 1fr;gap:16px;align-items:start}
  .hero-foot img,.avatar{width:64px;height:64px}
  .hero-foot .meta{grid-column:1/-1;justify-self:start;text-align:left}
  .scene{grid-template-columns:1fr;gap:28px;padding:72px var(--pad);min-height:0}
  .scene:nth-of-type(even){grid-template-columns:1fr;padding:72px var(--pad)}
  .scene:nth-of-type(even) .txt{order:0;padding-right:0}
  .blk{padding:80px var(--pad)}
  .steps{grid-template-columns:1fr 1fr}
  .about{grid-template-columns:1fr}
  .about>img{max-width:220px}
  .quote{margin-bottom:48px}
}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important;transition-delay:0ms!important}
}
</style>
</head>
<body>
<a class="skip" href="#work">Skip to the work</a>
<noscript><p>This site needs JavaScript to show its content. Email: andrew.c.pocta@gmail.com</p></noscript>
<div id="app"></div>
<dialog id="media" aria-label="Media viewer"><button class="mx" aria-label="Close">✕</button><div id="mediaBody"></div></dialog>
<dialog id="cmdk" aria-label="Quick navigation"><input id="kq" placeholder="Jump to a project or section" autocomplete="off" aria-label="Search projects and sections"><ul id="kl"></ul></dialog>

<script src="content.js"></script>
<script>
/* All words come from content.js (window.SITE). This script only lays them out. */
const S=window.SITE||{};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* Draft mode: add ?draft to the address to see amber [PLACEHOLDER] tags. Visitors never see them. */
const DRAFT=/[?&]draft\b/.test(location.search);
const isPH=s=>/\[PLACEHOLDER/.test(s||'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* text formatting: **bold** and [PLACEHOLDER: ...] tags */
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\[PLACEHOLDER[^\]]*\]/g,m=>DRAFT?`<span class="ph">${m}</span>`:'');
const paras=s=>String(s||'').split(/\n\n+/).map(p=>`<p>${fmt(p)}</p>`).join('');
const clean=a=>(a||[]).filter(x=>DRAFT||!isPH(x));
const live=p=>/^https?:\/\/|^\//.test(p.link||'')?p.link:null;
const shots=p=>[...new Set([...(p.tileImages||[]),...(p.images||[])])].filter(x=>x&&!isPH(x));
const pad=n=>String(n).padStart(2,'0');
/* content.js "color" → the project's accent */
const COL={teal:'#46d6bb',violet:'#ad94ff',blue:'#62a8ff',neutral:'#e9e4d6'};
const col=p=>COL[p.color]||COL.neutral;
/* the nowBuilding project leads; the rest keep their order from content.js */
const all=S.projects||[], lead=all.find(p=>p.nowBuilding);
const P=lead?[lead,...all.filter(p=>p!==lead)]:all;

function actions(p){
  let h='';
  if(live(p))h+=`<a class="btn primary demo" href="${esc(live(p))}" target="_blank" rel="noopener">Live demo ↗</a>`;
  else if(DRAFT&&isPH(p.link))h+=fmt(p.link);
  if(p.video&&!isPH(p.video))h+=`<button class="btn demo${live(p)?'':' primary'}" data-video="${esc(p.video)}" data-poster="${esc(isPH(p.poster)?'':p.poster||'')}">Watch demo ▶</button>`;
  else if(DRAFT&&isPH(p.video))h+=fmt(p.video);
  return h+`<button class="btn" data-p="${esc(p.id)}" aria-expanded="false" aria-controls="n-${esc(p.id)}">Project notes +</button>`;
}
function notes(p){
  let h='';
  if(p.details&&p.details!==p.summary)h+=`<p class="lead">${fmt(p.details)}</p>`;
  if(p.why)h+=`<h4>Why</h4><p>${fmt(p.why)}</p>`;
  const w=clean(p.what).filter(x=>x!==p.summary), hw=clean(p.how);
  if(w.length)h+=`<h4>What it does</h4><ul>${w.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul>`;
  if(hw.length)h+=`<h4>How it's built</h4><ul>${hw.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul>`;
  if(p.statusLong)h+=`<p class="status"><span>Status</span>${fmt(p.statusLong)}</p>`;
  return h;
}
/* contours: true in content.js → map contour lines behind that project */
function topo(){
  let out='';
  [[1080,200,12],[240,640,9]].forEach(([cx,cy,n],k)=>{
    for(let i=1;i<=n;i++){
      let d='';
      for(let a=0;a<=360;a+=6){
        const t=a*Math.PI/180, rr=i*36*(1+.16*Math.sin(3*t+i*.35+k)+.09*Math.sin(5*t-i*.5)+.05*Math.sin(9*t+k*2));
        d+=(a?'L':'M')+(cx+rr*Math.cos(t)*1.5).toFixed(1)+' '+(cy+rr*Math.sin(t)).toFixed(1);
      }
      out+=`<path d="${d}Z"/>`;
    }
  });
  return `<svg class="topo" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${out}</svg>`;
}
function scene(p,i){
  const sh=shots(p), c=col(p);
  return `<section class="scene" id="p-${esc(p.id)}" style="--c:${c}" aria-labelledby="h-${esc(p.id)}">
  ${p.contours?topo():''}
  <div class="txt">
    <div class="eyebrow mono"><span class="no">${pad(i+1)} / ${pad(P.length)}</span><span class="pill">${p.nowBuilding?'<i></i>':''}${fmt(p.status)}</span></div>
    <h2 class="poster" id="h-${esc(p.id)}">${fmt(p.title)}</h2>
    <div class="sum">${paras(p.summary)}</div>
    <div class="acts">${actions(p)}</div>
    <div class="notes" id="n-${esc(p.id)}" hidden>${notes(p)}</div>
  </div>
  ${sh.length?`<div class="stage">
    <button class="main" data-zoom="${esc(sh[0])}" aria-label="${esc(p.title)} screenshot, enlarge"><img src="${esc(sh[0])}" alt="" loading="lazy"></button>
    ${sh.length>1?`<div class="thumbs">${sh.map((s,j)=>`<button data-swap="${esc(s)}" aria-pressed="${j===0}" aria-label="Show ${esc(p.title)} screenshot ${j+1}"><img src="${esc(s)}" alt="" loading="lazy"></button>`).join('')}</div>`:''}
  </div>`:''}
</section>`;
}
const words=(S.headlineWords&&S.headlineWords.length)?S.headlineWords:['things'];
const initials=String(S.name||'').split(/\s+/).map(w=>w[0]||'').join('').slice(0,2);
const photo=()=>S.photo&&!isPH(S.photo)?`<img src="${esc(S.photo)}" alt="${esc(S.name)}" width="600" height="600">`:`<div class="avatar" aria-hidden="true">${esc(initials)}</div>`;
const mail=isPH(S.email)?fmt(S.email||''):`<a class="mail" href="mailto:${esc(S.email)}">${esc(S.email)}</a>`;

$('#app').innerHTML=`
<header class="top">
  <a class="who" href="#top">${esc(S.name)}</a>
  <nav aria-label="Sections">
    <a href="#work">Work</a><a href="#process">Process</a><a href="#about">About</a>
    <button class="jump" data-jump aria-label="Jump to a project or section">Jump <kbd>⌘K</kbd></button>
    <button class="menu" data-jump>Menu</button>
    <a class="cta" href="#contact">Contact</a>
  </nav>
</header>
<main id="top">
<section class="hero">
  <h1 class="poster" aria-label="I build useful ${esc(words.join(', '))} with AI."><span aria-hidden="true">I build</span><span aria-hidden="true">useful <span class="rot">${esc(words[0])}</span></span><span aria-hidden="true">with AI.</span></h1>
  <div class="hero-foot">${photo()}<p>${fmt(S.intro)}</p>
    <div class="meta mono">${fmt(S.role)}<br><a href="#work">${P.length} projects ↓</a></div></div>
</section>
<nav class="rail" aria-label="Projects">${P.map((p,i)=>`<a href="#p-${esc(p.id)}" style="--c:${col(p)}"><em>${esc(p.title)}</em>${pad(i+1)}</a>`).join('')}</nav>
<div id="work">${P.map(scene).join('')}</div>
<section class="blk" id="process">
  <h2 class="poster">How I build</h2>
  <p class="lede">${fmt(S.processIntro)}</p>
  <ul class="chips">${(S.buildChips||[]).map(c=>`<li>${fmt(c)}</li>`).join('')}</ul>
  <ol class="steps">${(S.process||[]).map((s,i)=>`<li><div class="num poster" aria-hidden="true">${pad(i+1)}</div><h3>${fmt(s.title)}</h3><p>${fmt(s.text)}</p></li>`).join('')}</ol>
  <div class="tools"><span class="mono kicker">Tools</span><ul>${(S.tools||[]).map(t=>`<li class="poster">${fmt(t)}</li>`).join('')}</ul></div>
</section>
<section class="blk" id="about">
  <h2 class="sr">About</h2>
  <p class="quote">${fmt(S.quote)}</p>
  <div class="about">
    ${S.photo&&!isPH(S.photo)?`<img src="${esc(S.photo)}" alt="${esc(S.name)}" width="600" height="600" loading="lazy">`:'<div></div>'}
    <div><p class="short">${fmt(S.aboutShort)}</p>${(S.bio||[]).map(b=>`<p>${fmt(b)}</p>`).join('')}
      <table class="cv"><tbody>${(S.cv||[]).map(r=>`<tr><td>${fmt(r[0])}</td><td>${fmt(r[1]||'')}</td></tr>`).join('')}</tbody></table></div>
  </div>
</section>
<section class="blk" id="contact">
  <h2 class="sr">Contact</h2>
  <span class="mono kicker">${fmt(S.contactKicker)}</span>
  <div id="mail">${mail}</div>
  <div id="links">${(S.links||[]).map(l=>`<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${fmt(l.label)}</a>`).join('')}</div>
</section>
</main>
<footer class="mono"><span>${fmt(S.footer)}</span><span>Designed &amp; built with Claude</span></footer>`;
document.documentElement.classList.add('js');

/* rotating headline word */
(()=>{const el=$('.rot');if(words.length<2)return;let i=0;
  setInterval(()=>{i=(i+1)%words.length;el.textContent=words[i];if(!RM){el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap');}},2400);})();

/* scenes: reveal on scroll + highlight the current project in the rail */
(()=>{const scenes=$$('.scene'),rail=$('.rail'),links=$$('a',rail);
  if(!('IntersectionObserver' in window)){scenes.forEach(s=>s.classList.add('in'));return;}
  const reveal=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');reveal.unobserve(e.target);}}),{threshold:.12});
  scenes.forEach(s=>reveal.observe(s));
  const vis=new Set();
  const cur=new IntersectionObserver(es=>{
    es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target));
    rail.classList.toggle('on',vis.size>0);
    const first=scenes.find(s=>vis.has(s));
    links.forEach((a,i)=>scenes[i]===first?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current'));
  },{rootMargin:'-45% 0px -45% 0px'});
  scenes.forEach(s=>cur.observe(s));})();

/* project notes, screenshot swapping, media viewer */
const media=$('#media'),mediaBody=$('#mediaBody');
function setNotes(btn,open){btn.setAttribute('aria-expanded',String(open));btn.textContent=open?'Project notes –':'Project notes +';document.getElementById(btn.getAttribute('aria-controls')).hidden=!open;}
document.addEventListener('click',e=>{
  const n=e.target.closest('button[data-p]'),s=e.target.closest('[data-swap]'),z=e.target.closest('[data-zoom]'),v=e.target.closest('[data-video]');
  if(n)setNotes(n,n.getAttribute('aria-expanded')!=='true');
  else if(s){const st=s.closest('.stage'),m=$('.main',st);m.dataset.zoom=s.dataset.swap;$('img',m).src=s.dataset.swap;$$('[data-swap]',st).forEach(b=>b.setAttribute('aria-pressed',String(b===s)));}
  else if(z){mediaBody.innerHTML=`<img src="${esc(z.dataset.zoom)}" alt="${esc(z.getAttribute('aria-label')||'')}">`;media.showModal();}
  else if(v){mediaBody.innerHTML=`<video src="${esc(v.dataset.video)}" ${v.dataset.poster?`poster="${esc(v.dataset.poster)}"`:''} controls autoplay playsinline></video>`;media.showModal();}
  else if(e.target===media||e.target.closest('#media .mx'))media.close();
  else if(e.target.closest('[data-jump]'))openK();
  else if(e.target===k)k.close();
});
media.addEventListener('close',()=>mediaBody.innerHTML='');

/* quick-jump palette: ⌘K / Ctrl+K, the Jump button, or Menu on phones */
const k=$('#cmdk'),kq=$('#kq'),kl=$('#kl');
const items=[...P.map(p=>({t:p.title,m:p.status,id:'p-'+p.id})),{t:'How I build',m:'Section',id:'process'},{t:'About',m:'Section',id:'about'},{t:'Contact',m:'Section',id:'contact'}];
let cur=items,sel=0;
function drawK(){kl.innerHTML=cur.map((x,i)=>`<li class="${i===sel?'sel':''}" data-i="${i}">${esc(x.t)}<span>${fmt(x.m)}</span></li>`).join('')||'<li>No matches</li>';const s=$('.sel',kl);if(s)s.scrollIntoView({block:'nearest'});}
function openK(){if(k.open)return;kq.value='';cur=items;sel=0;drawK();k.showModal();kq.focus();}
function go(x){k.close();const el=document.getElementById(x.id);if(!el)return;el.scrollIntoView({behavior:RM?'auto':'smooth'});const h=$('h2',el);if(h){h.tabIndex=-1;h.focus({preventScroll:true});}}
kq.addEventListener('input',()=>{const q=kq.value.trim().toLowerCase();cur=items.filter(x=>x.t.toLowerCase().includes(q));sel=0;drawK();});
kq.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(cur.length){sel=(sel+(e.key==='ArrowDown'?1:cur.length-1))%cur.length;drawK();}}
  else if(e.key==='Enter'&&cur[sel]){e.preventDefault();go(cur[sel]);}
});
kl.addEventListener('click',e=>{const li=e.target.closest('li[data-i]');if(li)go(cur[+li.dataset.i]);});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();k.open?k.close():openK();}});
</script>
</body>
</html>
